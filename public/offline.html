<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbfaf8">
<title>You're offline · Zadaci</title>
<style>
/* the same look as the app's error page (components/states.tsx), self-contained so it works offline */
:root{--bg:#fbfaf8;--surface:#fff;--text:#1d1c1a;--text-2:#57544e;--text-3:#6b6760;--border:#dad7d0;--accent:#ea5a32;
  --font:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--surface:#1d1d1c;--text:#eceae5;--text-2:#b5b2ab;--text-3:#9a968f;--border:#3a3936;--accent:#f9845f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:40px 20px;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.box{max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.logo{width:40px;height:40px;margin-bottom:6px}
.code{font-family:var(--mono);font-size:12px;color:var(--text-3);letter-spacing:.08em}
h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.015em}
p{color:var(--text-2);margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border-radius:6px;font:500 12.5px var(--font);border:1px solid transparent;cursor:pointer;text-decoration:none}
.btn-secondary{background:var(--surface);border-color:var(--border);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:14px;height:14px}
</style>
</head>
<body>
<main class="box">

<span class="code">OFFLINE</span>
<h1>You're offline.</h1>
<p>Zadaci needs a connection to load this page. Your data is safe — try again when you're back online.</p>
<div class="row">
<a class="btn btn-secondary" href="/">Go to Home</a>
<button class="btn btn-primary" type="button" onclick="location.reload()">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/></svg>

</button>
</div>
</main>
<script>
// back online: reload on its own
addEventListener("online", () => location.reload());
</script>
</body>
</html>
